[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nancora"
version = "0.1.0"
description = "A Python data-science toolkit that recommends which analyses are worth attention."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nancora" }]
keywords = ["data-analysis", "eda", "recommendation", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "plotly>=5.18",
  "jinja2>=3.1",
  "typer>=0.12",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "pandas-stubs>=2.0",
]

[project.scripts]
nancora = "nancora.cli:app"

[project.urls]
Homepage = "https://github.com/nancora/nancora"

[tool.hatch.build.targets.sdist]
include = ["src/nancora", "tests", "docs", "benchmarks", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
pretty = true
packages = ["nancora"]
mypy_path = "src"
